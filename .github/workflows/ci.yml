name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Unit + claim tests
        run: pytest -q

      - name: State-flip smoke (synthetic)
        run: python experiments/state-flip/run_pkg.py --seed 0

      - name: Same-info smoke
        run: python experiments/same-info/run.py --seed 0

      - name: Receptor-route smoke
        run: python experiments/receptor-route/run.py --seed 0

      - name: Plume-forage smoke
        run: python experiments/plume-forage/run.py --seed 0 --episodes 8
