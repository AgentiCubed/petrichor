[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petrichor"
version = "0.3.0"
description = "Grounded valence channel, with olfaction as its cleanest vehicle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Petrichor contributors" }]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dream = ["pandas>=2.0", "pyrfume", "rdkit"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["petrichor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
